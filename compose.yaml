services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sou2ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build:
      context: ./backend
    command: rq worker --with-scheduler --url ${REDIS_URL:-redis://redis:6379/0} ${KNOWLEDGE_QUEUE_NAME:-knowledge} ${CUSTOMER_MESSAGE_QUEUE_NAME:-customer-messages}
    environment:
      REDIS_URL: redis://redis:6379/0
      KNOWLEDGE_STORAGE_ROOT: /app/data/knowledge
      CUSTOMER_MESSAGE_QUEUE_NAME: ${CUSTOMER_MESSAGE_QUEUE_NAME:-customer-messages}
      OWNER_CHAT_PROVIDER: ${OWNER_CHAT_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3-flash-preview}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-120}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v23.0}
      WHATSAPP_REMOTE_VALIDATION_ENABLED: ${WHATSAPP_REMOTE_VALIDATION_ENABLED:-false}
      WHATSAPP_PROFILES_JSON: ${WHATSAPP_PROFILES_JSON:-{}}
      CUSTOMER_IDENTITY_ENCRYPTION_KEY: ${CUSTOMER_IDENTITY_ENCRYPTION_KEY:-}
      CUSTOMER_IDENTITY_HMAC_KEY: ${CUSTOMER_IDENTITY_HMAC_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      RETRIEVAL_CANDIDATE_LIMIT: ${RETRIEVAL_CANDIDATE_LIMIT:-10}
      RETRIEVAL_MINIMUM_SIMILARITY: ${RETRIEVAL_MINIMUM_SIMILARITY:-0.50}
      RAG_CONTEXT_MAX_CHUNKS: ${RAG_CONTEXT_MAX_CHUNKS:-6}
      RAG_CONTEXT_MAX_TOKENS: ${RAG_CONTEXT_MAX_TOKENS:-2500}
      CUSTOMER_GENERATION_LEASE_SECONDS: ${CUSTOMER_GENERATION_LEASE_SECONDS:-150}
      CUSTOMER_CHAT_MAX_OUTPUT_TOKENS: ${CUSTOMER_CHAT_MAX_OUTPUT_TOKENS:-384}
      CUSTOMER_CONVERSATION_HOURLY_LIMIT: ${CUSTOMER_CONVERSATION_HOURLY_LIMIT:-12}
      CUSTOMER_BUSINESS_HOURLY_LIMIT: ${CUSTOMER_BUSINESS_HOURLY_LIMIT:-120}
      WHATSAPP_OUTBOUND_MAX_ATTEMPTS: ${WHATSAPP_OUTBOUND_MAX_ATTEMPTS:-3}
      WHATSAPP_REQUEST_TIMEOUT_SECONDS: ${WHATSAPP_REQUEST_TIMEOUT_SECONDS:-15}
      WHATSAPP_WEBHOOK_MAX_BYTES: ${WHATSAPP_WEBHOOK_MAX_BYTES:-65536}
      POSTGRESQL_DATABASE_URL: postgresql+psycopg://${POSTGRES_RUNTIME_USER:-sou2ai_runtime_login}:${POSTGRES_RUNTIME_PASSWORD:-sou2ai_runtime_local}@postgres:5432/${POSTGRES_DEV_DB:-sou2ai_dev}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sou2ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sou2ai_local}
      POSTGRES_DB: ${POSTGRES_DEV_DB:-sou2ai_dev}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-sou2ai_test}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-sou2ai_runtime_login}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-sou2ai_runtime_local}
      POSTGRES_LIFECYCLE_OPERATOR_USER: ${POSTGRES_LIFECYCLE_OPERATOR_USER:-sou2ai_lifecycle_operator_login}
      POSTGRES_LIFECYCLE_OPERATOR_PASSWORD: ${POSTGRES_LIFECYCLE_OPERATOR_PASSWORD:-sou2ai_lifecycle_operator_local}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - sou2ai_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  fake-store-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${FAKE_STORE_ADMIN_USER:-fake_store_admin}
      POSTGRES_PASSWORD: ${FAKE_STORE_ADMIN_PASSWORD:-fake_store_admin_local}
      POSTGRES_DB: ${FAKE_STORE_DATABASE:-fake_store}
      FAKE_STORE_READONLY_USER: ${FAKE_STORE_READONLY_USER:-sou2ai_store_reader}
      FAKE_STORE_READONLY_PASSWORD: ${FAKE_STORE_READONLY_PASSWORD:-sou2ai_store_reader_local}
      FAKE_STORE_TIMEZONE: ${FAKE_STORE_TIMEZONE:-Asia/Beirut}
      FAKE_STORE_CURRENCY: ${FAKE_STORE_CURRENCY:-LBP}
    ports:
      - "127.0.0.1:${FAKE_STORE_PORT:-5434}:5432"
    volumes:
      - sou2ai_fake_store_data:/var/lib/postgresql/data
      - ./docker/fake-store/init-fake-store.sh:/docker-entrypoint-initdb.d/10-init-fake-store.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  sou2ai_postgres_data:
  sou2ai_fake_store_data:
  sou2ai_redis_data:
